[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned deliberately: these contracts are protocol surface (the SealRegistry's storage layout is
# read by the privileged system call in ureth via eth_getProof), so the compiler is part of the
# spec, not a local preference. Bump it in a dedicated change with the layout diff reviewed.
#
# 0.8.37 with the IR pipeline (owner decision for the SealRegistry, bft-core #12): the accepted
# sixteen-argument open() signature (#153 §6.1) exceeds the legacy code generator's stack reach in
# the ABI decoder itself. The IR pipeline keeps that signature and its selector unchanged; only the
# generated bytecode, and so the pinned registry code hash, depends on this choice. Ordinary Yul IR,
# no experimental features.
solc_version = "0.8.37"
evm_version = "cancun"          # matches the shard's chain spec: shanghai+cancun at genesis
optimizer = true
optimizer_runs = 200
via_ir = true

# The runtime bytecode is protocol surface: its keccak256 is the registryCodeHash the genesis record
# pins (bft-core #153 §2.2, §5.1). Metadata would tie that hash to source paths and file contents
# outside the contract, so no metadata hash and no CBOR metadata trailer are emitted.
bytecode_hash = "none"
cbor_metadata = false

# The SealRegistry declares no Solidity state variables; a test reads the storage layout to prove it.
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./artifacts" }]

# Custody and registry code must not silently truncate.
deny_warnings = true

[lint]
# Linting is enforced on contract sources. Tests use low-level calls, cheatcodes and helper casts on
# purpose, and deny_warnings would otherwise turn those lint findings into build failures.
ignore = ["test/**/*.sol"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[invariant]
runs = 256
depth = 128
# Expected registry refusals are caught by the handler through low-level calls. A handler revert
# is therefore a harness/assertion failure: ignoring it would roll back and hide a bad transition.
fail_on_revert = true

[fuzz]
runs = 1024
