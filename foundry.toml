[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned deliberately: these contracts are protocol surface (the SealRegistry's storage layout is
# read by the privileged system call in ureth via eth_getProof), so the compiler is part of the
# spec, not a local preference. Bump it in a dedicated change with the layout diff reviewed.
solc_version = "0.8.28"
evm_version = "cancun"          # matches the shard's chain spec: shanghai+cancun at genesis
optimizer = true
optimizer_runs = 200
via_ir = false

# Custody and registry code must not silently truncate.
deny_warnings = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[fuzz]
runs = 1024
