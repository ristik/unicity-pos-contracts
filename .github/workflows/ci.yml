name: ci

# Mirrors bft-core's F1 decision: checks run and are visible on every push and PR, and merging
# stays a human decision — no branch protection, no required-check rules.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: the registry's runtime bytecode and code hash are protocol surface.
          version: v1.8.1
      - name: forge fmt
        run: forge fmt --check
      - name: PoS-capable VR build is generated
        run: python3 script/gen-vr-pos-build.py --check
      - name: ERC20 NB2 specializations match their native sources
        run: python3 script/nb2-erc20/generate.py --check
      - name: VR suite against the PoS-capable build
        run: VR_BUILD=pos forge test --match-path "test/vr/*" --no-match-path "test/vr/pos/*"
      - name: forge build
        run: forge build --sizes
      - name: SealRegistry artifact is current
        run: |
          bash script/seal-registry-artifact.sh
          git diff --exit-code artifacts/
      - name: P85 interface manifest is current
        run: |
          bash script/p85-interface-manifest.sh
          git diff --exit-code artifacts/p85-pr2-interface.json
      - name: The forge-shaped evidence corpus is the conversion of bft-core's verbatim one
        run: |
          python3 script/evidence-corpus-convert.py test/p85/fixtures/evidence-digest-corpus-go-v1.json test/p85/fixtures/evidence-digest-corpus-v1.json
          git diff --exit-code test/p85/fixtures/evidence-digest-corpus-v1.json
      - name: The forge-shaped post-term corpus is the conversion of bft-core's verbatim one
        run: |
          python3 script/post-term-corpus-convert.py test/p85/fixtures/post-term-corpus-go-v1.json test/p85/fixtures/post-term-corpus-v1.json
          git diff --exit-code test/p85/fixtures/post-term-corpus-v1.json
      - name: NB2 vault vectors are the conversion of the pinned shared file
        # test/nb2/vectors/nb2-vectors.json is native-bridge-plugins protocol/vectors/nb2/nb2-vectors.json verbatim; the script
        # checks it against its pinned sha256 and that the forge-shaped file the vault tests read is its exact conversion.
        run: python3 script/nb2-vectors.py --check
      - name: The PoA composer vectors are the exact-rational model's output
        # tools/poa_composer_vectors.py is an independent Fraction-arithmetic reading of design 3.7.3; PoaComposerVectors.t.sol
        # requires the production composer to choose exactly its trials.
        run: python3 tools/poa_composer_vectors.py | cmp - test/vr/poa/fixtures/poa-composer.json
      - name: Shared fixtures agree with bft-core at the pinned commit
        # The cross-repository consistency suite (bft-core xrepo/README.md): every file this repository shares with bft-core, in either
        # direction, is byte-identical to bft-core's at the commit pinned in xrepo/bft-core-pin.json. The manifest and the check are
        # bft-core's own, read from that commit. The forge tests below regenerate the files this repository produces and compare
        # them with the committed ones, so a change here fails there first and then here until bft-core has the new file.
        run: |
          repo=$(python3 -c "import json;print(json.load(open('xrepo/bft-core-pin.json'))['repo'])")
          commit=$(python3 -c "import json;print(json.load(open('xrepo/bft-core-pin.json'))['commit'])")
          git init --quiet "$RUNNER_TEMP/bft-core"
          git -C "$RUNNER_TEMP/bft-core" fetch --quiet --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/bft-core" checkout --quiet FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bft-core" rev-parse HEAD)" = "$commit"
          python3 "$RUNNER_TEMP/bft-core/xrepo/check.py" --bft-core "$RUNNER_TEMP/bft-core" --contracts .
      - name: Stage signed NB2 v1.1 vectors
        run: |
          git -C "$RUNNER_TEMP/bft-core" fetch --quiet --depth 1 https://github.com/ristik/bft-core.git 8c1b6ca9ff18648f98f3df588e70d70285e6adc6
          bash script/nb2/stage-flat-vectors.sh "$RUNNER_TEMP/bft-core"
      - name: forge test
        run: forge test --no-match-path "test/p85/PublicationFixture.t.sol" -vvv
      - name: The P85 publication fixture matches its focused build
        # The fixture commits to the deployed test graph's bytecode. Use the same compiler inputs
        # for regeneration and replay, with a cache separate from the full build.
        env:
          FOUNDRY_OUT: out-p85-publication
          FOUNDRY_CACHE_PATH: cache-p85-publication
          FOUNDRY_SKIP: '["**/nb2/erc20/**"]'
        run: forge test --match-path "test/p85/PublicationFixture.t.sol" -vvv
      - name: The VR hook fixture is the generator's output
        # test/vr/fixtures/vr-hook.json (copied into ureth's crates/unicity/execution/testdata) is regenerated from a clean raw
        # directory: the dumps of VRHookState.t.sol folded by tools/vr_hook_state.py. Any change to VR, the facets, PoA, the
        # composer, the test modules or a scenario's setup fails here until the fixture (and ureth's copy) is regenerated.
        run: |
          rm -rf test/vr/fixtures/vr-hook-raw
          mkdir -p test/vr/fixtures/vr-hook-raw
          VR_WRITE_HOOK_STATE=test/vr/fixtures/vr-hook-raw forge test --match-contract VRHookStateTest
          python3 tools/vr_hook_state.py test/vr/fixtures/vr-hook-raw "$RUNNER_TEMP/vr-hook.json"
          cmp "$RUNNER_TEMP/vr-hook.json" test/vr/fixtures/vr-hook.json
      - name: The PoS-capable VR hook fixture is the generator's output
        # test/vr/fixtures/vr-hook-pos.json: the same generator under VR_BUILD=pos (the PoS-capable build's runtimes, caps and H = 16).
        run: |
          rm -rf test/vr/fixtures/vr-hook-pos-raw
          mkdir -p test/vr/fixtures/vr-hook-pos-raw
          VR_BUILD=pos VR_WRITE_HOOK_STATE=test/vr/fixtures/vr-hook-pos-raw forge test --match-contract VRHookStateTest
          python3 tools/vr_hook_state.py test/vr/fixtures/vr-hook-pos-raw "$RUNNER_TEMP/vr-hook-pos.json" --pos
          cmp "$RUNNER_TEMP/vr-hook-pos.json" test/vr/fixtures/vr-hook-pos.json
