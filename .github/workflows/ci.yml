name: ci

# Mirrors bft-core's F1 decision: checks run and are visible on every push and PR, and merging
# stays a human decision — no branch protection, no required-check rules.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: the registry's runtime bytecode and code hash are protocol surface.
          version: v1.8.1
      - name: forge fmt
        run: forge fmt --check
      - name: forge build
        run: forge build --sizes
      - name: SealRegistry artifact is current
        run: |
          bash script/seal-registry-artifact.sh
          git diff --exit-code artifacts/
      - name: P85 interface manifest is current
        run: |
          bash script/p85-interface-manifest.sh
          git diff --exit-code artifacts/p85-pr2-interface.json
      - name: Bridge goldens agree with the sealed shared corpus
        run: |
          git clone --quiet https://github.com/ristik/native-bridge-plugins "$RUNNER_TEMP/corpus"
          git -C "$RUNNER_TEMP/corpus" checkout --quiet "$(python3 -c "import json;print(json.load(open('script/bridge-golden/corpus-pin.json'))['corpus']['commit'])")"
          python3 script/bridge-golden/check-corpus.py "$RUNNER_TEMP/corpus"
      - name: Shared fixtures agree with bft-core at the pinned commit
        # The cross-repository consistency suite (bft-core xrepo/README.md): every file this repository shares with bft-core, in either
        # direction, is byte-identical to bft-core's at the commit pinned in xrepo/bft-core-pin.json. The manifest and the check are
        # bft-core's own, read from that commit. The forge tests below regenerate the files this repository produces and compare
        # them with the committed ones, so a change here fails there first and then here until bft-core has the new file.
        run: |
          repo=$(python3 -c "import json;print(json.load(open('xrepo/bft-core-pin.json'))['repo'])")
          commit=$(python3 -c "import json;print(json.load(open('xrepo/bft-core-pin.json'))['commit'])")
          git init --quiet "$RUNNER_TEMP/bft-core"
          git -C "$RUNNER_TEMP/bft-core" fetch --quiet --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/bft-core" checkout --quiet FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bft-core" rev-parse HEAD)" = "$commit"
          python3 "$RUNNER_TEMP/bft-core/xrepo/check.py" --bft-core "$RUNNER_TEMP/bft-core" --contracts .
      - name: forge test
        run: forge test -vvv
